name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  php-extensions: iconv, json, mbstring, xml, gd, intl, tokenizer, mysqli
  php-tools: composer:v2
  GENERATOR_DB_HOST: 127.0.0.1
  GENERATOR_DB_PORT: 3306
  GENERATOR_DB_NAME: test
  GENERATOR_DB_USER: root
  GENERATOR_DB_PASSWORD: root

jobs:
  tests:
    name: PHP ${{ matrix.php }} tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=10s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.php-extensions }}
          tools: ${{ env.php-tools }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Import test database
        run: mysql --host 127.0.0.1 --port 3306 -uroot -proot test < tests/db.sql

      - name: Run tests
        run: composer tester
